# Dependabot hanya mengusulkan update minor & patch (dikelompokkan jadi satu PR per folder).
# Update MAJOR sengaja diabaikan: butuh migrasi kode & diuji bersama, jadi dikerjakan terencana
# (resep di CLAUDE.md §14, kebijakan di docs/ARCHITECTURE.md §2.3).
# Rentang `versions`: npm memakai sintaks semver, Docker memakai sintaks Bundler.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # 0.x: minor bisa breaking. KaTeX 0.19 dijadwalkan manual ≥ 2026-10-29 (docs/UPGRADE-PLAN.md §2.2);
      # hapus aturan ini saat upgrade dikerjakan.
      - dependency-name: katex
        versions: [">=0.19.0"]
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  # Dockerfile aplikasi + image service backup (base = image postgres; versi major PostgreSQL ada di sufiks tag)
  - package-ecosystem: docker
    directories: [/backend, /frontend, /infra/backup, /infra/onlyoffice]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # nginx minor ganjil = cabang mainline; produksi memakai stable (minor genap)
      - dependency-name: nginx
        versions: [">= 1.31, < 1.32", ">= 1.33, < 1.34", ">= 1.35, < 1.36"]
  # Image infra di docker-compose.yml & docker-compose.prod.yml (postgres/pgvector, redis, seaweedfs, caddy).
  # PostgreSQL major ada di sufiks tag (-pg18) sehingga tidak pernah diubah otomatis (upgrade major: DEPLOYMENT.md §8).
  - package-ecosystem: docker-compose
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions: { patterns: ["*"] }
