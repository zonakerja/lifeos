# ============================================================================
# LifeOS — deployment PRODUKSI (VPS). Panduan lengkap: docs/DEPLOYMENT.md
#
#   cp .env.example .env        # isi domain, secret, password
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml exec backend node dist/database/seed.js   # sekali
#
# Hanya Caddy yang membuka port (80/443, HTTPS otomatis). Database, Redis, dan
# object storage hanya dapat diakses dari jaringan internal Docker.
# ============================================================================

name: lifeos-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
      frontend: { condition: service_started }
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN di .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL di .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  frontend:
    build: ./frontend
    image: lifeos-frontend:${APP_VERSION:-latest}
    restart: unless-stopped
    logging: *logging

  backend:
    build: ./backend
    image: lifeos-backend:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://lifeos:${POSTGRES_PASSWORD}@postgres:5432/lifeos?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET di .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET di .env}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: https://${APP_DOMAIN}
      TRUST_PROXY: "true"
      # Kosong = Secure (HTTPS). Set false HANYA untuk uji coba tanpa domain/HTTPS (lihat DEPLOYMENT.md §0.4)
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD di .env}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID di .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY di .env}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ASSET_BUCKET: ${ASSET_BUCKET:-lifeos-assets}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-100}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    logging: *logging

  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD di .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["sh", "-c", 'exec redis-server --appendonly yes --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD di .env}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  storage:
    # SeaweedFS S3. Kredensial dirender dari env saat start (tidak ada kredensial bawaan).
    # Untuk S3/R2/B2 eksternal: set S3_ENDPOINT & kredensialnya di .env (service ini boleh dibiarkan).
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID di .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY di .env}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"lifeos","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - storage-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  backup:
    # Backup harian: dump database (pg_dump -Fc) + arsip berkas object storage ke ./backups
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: lifeos
      PGDATABASE: lifeos
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./infra/backup/backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - storage-data:/storage:ro
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  redis-data:
  storage-data:
