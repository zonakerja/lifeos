# Nginx image frontend: menyajikan SPA statis. Routing /api & HTTPS ditangani Caddy
# (docker-compose.prod.yml). Header keamanan + CSP untuk dokumen aplikasi.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Header keamanan (diulang di setiap location karena add_header tidak diwarisi bila location punya add_header)
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";

  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Aset build Vite (nama ber-hash) → cache panjang
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff";
    try_files $uri =404;
  }

  # Rute SPA (React Router) → index.html, tanpa cache
  location / {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy $csp;
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()";
    try_files $uri $uri/ /index.html;
  }
}
