name: lifeos

# Infrastruktur DEVELOPMENT lokal (postgres, redis, object storage): docker compose up -d
# Deployment produksi/VPS memakai docker-compose.prod.yml (lihat docs/DEPLOYMENT.md).
# Port host = port default masing-masing service.

services:
  postgres:
    # PostgreSQL 18 + ekstensi pgvector (untuk embedding/semantic search AI)
    image: pgvector/pgvector:0.8.7-pg18
    container_name: lifeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lifeos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Image 18+: mount ke /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker), bukan .../data.
      # Volume baru per major; upgrade major = dump/restore (docs/SETUP.md §7.1).
      - lifeos-postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lifeos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.10-alpine
    container_name: lifeos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - lifeos-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    # Object storage S3-compatible (SeaweedFS). Image MinIO tidak lagi tersedia di registry publik.
    image: chrislusf/seaweedfs:4.50
    container_name: lifeos-storage
    restart: unless-stopped
    command: >-
      server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "8888:8888"   # Filer UI (browse file)
    volumes:
      - lifeos-storage-data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  onlyoffice:
    # Editor dokumen ONLYOFFICE Docs Community (menu Tools → ONLYOFFICE, docs/ONLYOFFICE.md).
    # Opsional & berat (± 1–2 GB RAM) → hanya menyala dengan profile: docker compose --profile office up -d
    # Image = onlyoffice/documentserver + plugin AI resmi (infra/onlyoffice/Dockerfile)
    build: ./infra/onlyoffice
    # Image lokal (tidak ada di Docker Hub). Tag lewat variabel agar Dependabot tidak mencarinya di registry
    # (tag versi biasa membuat pembaruan docker-compose Dependabot gagal); nilai default = versi ONLYOFFICE.
    image: lifeos-onlyoffice:${LIFEOS_ONLYOFFICE_TAG:-10.0}
    container_name: lifeos-onlyoffice
    restart: unless-stopped
    profiles: ["office"]
    environment:
      JWT_ENABLED: "true"
      # Secret khusus development; harus sama dengan ONLYOFFICE_JWT_SECRET di backend/.env.
      JWT_SECRET: lifeos-dev-onlyoffice-jwt-secret-0123456789abcdef
      # Header JWT terpisah dari "Authorization" (Bearer milik LifeOS) agar tidak tertukar.
      JWT_HEADER: AuthorizationJwt
      # Berkas diunduh dari backend di alamat privat (IP gateway WSL di dev, jaringan Docker di produksi).
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "8080:80"
    volumes:
      - lifeos-onlyoffice-cache:/var/lib/onlyoffice
      - lifeos-onlyoffice-logs:/var/log/onlyoffice
      # Font tambahan (.ttf/.otf) → restart container; lihat infra/onlyoffice/fonts/README.md
      - ./infra/onlyoffice/fonts:/usr/share/fonts/truetype/custom:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/healthcheck | grep -q true"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  robot:
    # Browser otomatis (Playwright) untuk konektor SRIKANDI & e-Kinerja (Tools → Konektor Robot, docs/AI-AGENT.md §21).
    # Opsional (± 300–600 MB RAM saat dipakai) → hanya menyala dengan profile: docker compose --profile robot up -d
    # Tanpa penyimpanan: sesi login dikirim/disimpan backend (terenkripsi), bukan di container ini.
    build: ./robot
    # Image lokal; tag lewat variabel (lihat catatan onlyoffice) — nilai default = versi Playwright
    image: lifeos-robot:${LIFEOS_ROBOT_TAG:-1.63.0}
    container_name: lifeos-robot
    restart: unless-stopped
    profiles: ["robot"]
    environment:
      # Token khusus development; harus sama dengan ROBOT_TOKEN di backend/.env.
      ROBOT_TOKEN: lifeos-dev-robot-token-0123456789abcdef0123
    ports:
      # Hanya untuk backend di laptop (bukan untuk dibuka ke jaringan)
      - "127.0.0.1:4100:4100"
    shm_size: 512m
    init: true

  hermes:
    # Agen AI Hermes (Nous Research) untuk skill dokumen bertemplat & asisten pribadi (docs/AI-AGENT.md §22–§23).
    # Opsional → hanya menyala dengan profile: sh infra/hermes/up.sh (menghitung alamat backend LifeOS di Windows)
    # Data (config.yaml, .env berisi API key model, memori, sesi) di volume lifeos-hermes-data — bukan di repo.
    image: nousresearch/hermes-agent:${LIFEOS_HERMES_TAG:-v0.22.2}
    container_name: lifeos-hermes
    restart: unless-stopped
    profiles: ["agent"]
    command: gateway run
    environment:
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      # Kunci khusus development; harus sama dengan HERMES_API_KEY di backend/.env.
      API_SERVER_KEY: lifeos-dev-hermes-key-0123456789abcdef
    extra_hosts:
      # Backend LifeOS berjalan di Windows (port 4000); host-gateway Docker = VM WSL, bukan Windows → up.sh mengisi
      # LIFEOS_API_HOST dengan IP gateway WSL. Di produksi backend dijangkau lewat alias jaringan yang sama.
      - "lifeos-api:${LIFEOS_API_HOST:-host-gateway}"
    volumes:
      - lifeos-hermes-data:/opt/data
      # Skill LifeOS dari repo (baca-saja) → kategori "lifeos" di daftar skill Hermes
      - ./agents/hermes/skills:/opt/data/skills/lifeos:ro
      - ./infra/hermes:/opt/lifeos:ro
    ports:
      # Hanya untuk backend di laptop (bukan untuk dibuka ke jaringan)
      - "127.0.0.1:8642:8642"
    shm_size: 1g

volumes:
  lifeos-hermes-data:
    name: lifeos-hermes-data
  lifeos-onlyoffice-cache:
    name: lifeos-onlyoffice-cache
  lifeos-onlyoffice-logs:
    name: lifeos-onlyoffice-logs
  lifeos-postgres18-data:
    name: lifeos-postgres18-data
  lifeos-redis-data:
    name: lifeos-redis-data
  lifeos-storage-data:
    name: lifeos-storage-data

networks:
  default:
    name: lifeos-network
